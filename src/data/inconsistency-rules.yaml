# Inconsistency rules — surfaced by the rule-based pre-generation review.
# Validated against src/data/schemas/inconsistency-rules.schema.json.
# Skeleton: a few illustrative rules. Filled out as more domain knowledge accumulates.
version: "0.1.0"

rules:
  - id: production_without_logging
    severity: warning
    when:
      "phases.vision.answers.quality_bar.value": "production"
      "phases.logging_observability.mode": "skipped"
    message: |
      You set the quality bar to "production" but skipped Phase 12 (Logging & observability).
      Production systems usually need at least basic structured logs. Confirm you really mean to skip.
    suggested_fix: |
      Re-open Phase 12 and answer at least the "what gets logged" question.

  - id: gdpr_without_data_residency
    severity: conflict
    when:
      "phases.compliance.answers.regimes.value": { contains: "gdpr" }
      "phases.data_store.mode": "skipped"
    message: |
      GDPR applies but Phase 8 (Data — Store) is skipped, so data residency is undefined.
      Where personal data is stored matters under GDPR.
    suggested_fix: |
      Re-open Phase 8 and specify where data lives.

  - id: validation_silent_with_strict_intent
    severity: conflict
    when:
      "phases.validation.answers.failure_response.value": "sanitise"
    message: |
      Validation policy is set to "Sanitise / coerce silently" — but free-text
      comments under Phase 5 (Data — Input) or Phase 9 (Data — Output) often
      describe rejection-with-summary. Confirm whether the policy is silent
      sanitisation OR explicit rejection. The two contradict each other.
    suggested_fix: |
      If you want explicit rejection (e.g. "duplicate emails are rejected with
      a summary"), change failure_response to "reject". Use "sanitise" only
      when you genuinely want silent coercion (e.g. trimming whitespace).

  - id: pii_unmasked_unencrypted
    severity: warning
    when:
      "phases.data_store.answers.encryption_at_rest.value": false
      "phases.logging_observability.answers.pii_masking.value": false
    message: |
      Both encryption-at-rest and PII masking in logs are off. If the data
      store contains anything that could be considered personal (names,
      emails, phone numbers, addresses, identifiers, etc.) this combination
      is risky even at a personal quality bar. Confirm there is no PII, or
      enable masking and/or encryption.
    suggested_fix: |
      Either explicitly attest "no PII is stored" in this phase's comment,
      or set encryption_at_rest to true (Phase 8) and pii_masking to true
      (Phase 12).
